<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Architecture</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eff1f5; --border:#dde1e7; --text:#1a2230; --muted:#5a6677;
  --accent:#2563eb; --req:#2563eb; --res:#ea580c; --warn:#b45309; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --c-user:#475569; --c-frontend:#0284c7; --c-gateway:#7c3aed; --c-middleware:#b45309; --c-service:#2563eb;
  --c-database:#047857; --c-cache:#dc2626; --c-queue:#a21caf; --c-external-api:#0f766e; --c-storage:#be185d; --c-unknown:#6b7280;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#151b23; --surface2:#1c242e; --border:#2a3340; --text:#e6edf3; --muted:#9ba8b8;
  --accent:#60a5fa; --req:#60a5fa; --res:#fb923c; --warn:#fbbf24; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  --c-user:#94a3b8; --c-frontend:#38bdf8; --c-gateway:#a78bfa; --c-middleware:#fbbf24; --c-service:#60a5fa;
  --c-database:#34d399; --c-cache:#f87171; --c-queue:#e879f9; --c-external-api:#2dd4bf; --c-storage:#f472b6; --c-unknown:#9ca3af;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:12px}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;width:min(380px,40vw)}
.search input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:50}
.results button{display:flex;gap:8px;width:100%;text-align:left;padding:8px 12px;border:0;background:none;align-items:baseline}
.results button:hover,.results button.on{background:var(--surface2)}
.results .rk{font-size:11px;color:var(--muted);min-width:46px;text-transform:uppercase;letter-spacing:.04em}
.results .none{padding:10px 12px;color:var(--muted)}
.icon-btn{border:1px solid var(--border);background:var(--surface2);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--accent)}

/* tabs */
.tabs{display:flex;gap:4px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.tab{border:0;background:none;padding:11px 14px;font-weight:550;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}

/* app */
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.bar label{color:var(--muted);font-size:12.5px}
select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:4px 11px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0b1220}
.btn{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:6px 12px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1220}
.spacer{flex:1}
.check{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px}

/* overview */
#cy{flex:1;min-height:320px;background:var(--bg)}
.legend{display:block}
.lrow{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:2px 0}
.legend ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px}
.legend li{margin:3px 0}
.legend h4{margin:10px 0 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.legend button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:2px 0;font-size:12.5px;text-align:left}
.legend button[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.legend svg{flex:none}
.legend .sep{border-top:1px solid var(--border);margin:10px 0 2px}

/* journey */
.jwrap{overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border);flex:none}
#jsvg{display:block}
.jbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);min-width:92px;text-align:center}
.key{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12.5px}
.key i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.jlower{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:0;overflow:hidden}
.steps{overflow:auto;border-right:1px solid var(--border);background:var(--surface)}
.steps ol{list-style:none;margin:0;padding:6px}
.steps li button{display:grid;grid-template-columns:24px 1fr;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;border-left:3px solid transparent}
.steps li button:hover{background:var(--surface2)}
.steps li button[aria-current="step"]{background:var(--surface2);border-left-color:var(--req)}
.steps li button.res[aria-current="step"]{border-left-color:var(--res)}
.steps .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.steps .t{font-size:13px}
.steps .t small{display:block;color:var(--muted);font-size:12px}
.steps li.future button{opacity:.55}
.steps li.match button{box-shadow:inset 0 0 0 1.5px var(--accent)}
.bdg{display:inline-block;font-size:11px;padding:0 6px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);margin-left:4px}
.card{overflow:auto;padding:16px 20px;background:var(--surface)}
.card h3{margin:0 0 2px;font-size:16px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--surface2)}
.tag.req{color:var(--req);border-color:currentColor;background:none}
.tag.res{color:var(--res);border-color:currentColor;background:none}
.field{margin:10px 0}
.field h5{margin:0 0 3px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field p{margin:0}
.note{padding:8px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);margin:10px 0}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* svg (journey) */
.jn rect{fill:var(--surface);stroke-width:1.6;transition:opacity .2s}
.jn text{fill:var(--text);font:600 12px var(--sans);pointer-events:none}
.jn text.sub{fill:var(--muted);font:11px var(--sans)}
.jn{cursor:pointer}
.jn.idle{opacity:.4}
.jn.active rect{stroke-width:3.2}
.jn.match rect{stroke-dasharray:5 3}
.jp{fill:none;stroke-width:2.2;stroke-linecap:round;cursor:pointer;transition:opacity .2s}
.jp.request{stroke:var(--req)} .jp.response{stroke:var(--res)}
.jp.future{opacity:.22;stroke-dasharray:4 5}
.jp.visited{opacity:.85}
.jp.current{opacity:1;stroke-width:3.4}
.jb circle{stroke-width:1.5;fill:var(--surface);cursor:pointer}
.jb.request circle{stroke:var(--req)} .jb.response circle{stroke:var(--res)}
.jb text{font:700 10.5px var(--sans);fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.jb.future{opacity:.4}
.dot{stroke:var(--surface);stroke-width:2.5}
.dot.request{fill:var(--req)} .dot.response{fill:var(--res)}
.halo{opacity:.25}
.halo.request{fill:var(--req)} .halo.response{fill:var(--res)}
#arrReq{fill:var(--req)} #arrRes{fill:var(--res)}
.lane{fill:var(--muted);font:600 10.5px var(--sans);letter-spacing:.06em;opacity:.8}

/* sequence */
#seqwrap{flex:1;min-height:0;overflow:auto;padding:16px;background:var(--surface)}
#seq svg{height:auto}
#seq .messageText,#seq .messageLine0,#seq .messageLine1,#seq rect.actor,#seq text.actor{cursor:pointer}
#seq .msel{stroke-width:3px!important}
.seqfallback{max-width:760px;margin:0 auto}
.seqfallback ol{padding-left:22px}
.seqfallback li{margin:6px 0}

/* sidebar */
aside{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.stabs{display:flex;border-bottom:1px solid var(--border)}
.stab{flex:1;border:0;background:none;padding:10px;font-weight:550;color:var(--muted);border-bottom:2px solid transparent}
.stab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.sclose{flex:none;width:40px;border:0;background:none;color:var(--muted);font-size:18px;line-height:1}
.sclose:hover{color:var(--text)}
.btn[aria-pressed="true"]{background:var(--surface2)}
.app.noside{grid-template-columns:minmax(0,1fr)}
.app.noside aside{display:none}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;padding:0 5px;margin-left:5px}
:root[data-theme="dark"] .badge{color:#1a1200}
.spanel{display:none;overflow:auto;padding:16px;flex:1;min-height:0}
.spanel.on{display:block}
.spanel h2{margin:0 0 4px;font-size:16px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.ev{list-style:none;margin:4px 0 0;padding:0}
.ev li{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:5px 8px;border:1px solid var(--border);border-radius:8px;margin:4px 0;background:var(--surface2)}
.ev code{overflow-wrap:anywhere}
.ev .nt{color:var(--muted);font-size:12px;flex-basis:100%}
.copy{margin-left:auto;border:1px solid var(--border);background:var(--surface);border-radius:6px;font-size:11px;padding:1px 7px}
.linklist{list-style:none;margin:4px 0;padding:0}
.linklist button{border:0;background:none;color:var(--accent);padding:2px 0;text-align:left;overflow-wrap:anywhere}
.linklist button:hover{text-decoration:underline}
.ucard{border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--surface2)}
.ucard h3{margin:0 0 4px;font-size:13.5px;overflow-wrap:anywhere}
.ucard p{margin:4px 0;font-size:13px}
.hint{color:var(--muted);font-size:13px}

@media (max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 42vh}
  .app.noside{grid-template-rows:minmax(0,1fr)}
  aside{border-left:0;border-top:1px solid var(--border)}
  .search{width:34vw}
  .jlower{grid-template-columns:1fr;overflow:auto}
  .steps{max-height:200px;border-right:0;border-bottom:1px solid var(--border)}
}
@media (max-width:560px){
  .brand p{display:none}
  .search{width:44vw}
  .tab{padding:10px 9px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1 id="projName">Architecture</h1><p id="projSummary"></p></div>
  <div class="search">
    <input id="search" type="search" placeholder="Search components, edges, steps  ( / )" aria-label="Search" autocomplete="off">
    <div id="results" class="results" hidden></div>
  </div>
  <button id="panelBtn" class="btn" type="button" aria-pressed="true" title="Show or hide the side panel">Panel</button>
  <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
</header>
<nav class="tabs" role="tablist" aria-label="Views">
  <button class="tab" role="tab" id="tab-overview" data-view="overview" aria-selected="true">Overview map</button>
  <button class="tab" role="tab" id="tab-journey" data-view="journey" aria-selected="false">Request journey</button>
  <button class="tab" role="tab" id="tab-sequence" data-view="sequence" aria-selected="false">Sequence diagram</button>
</nav>

<div class="app">
<main>
  <section id="view-overview" class="view on" role="tabpanel" aria-labelledby="tab-overview">
    <div class="bar">
      <button class="btn" id="fitBtn" type="button">Fit</button>
      <button class="btn" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out">&minus;</button>
      <button class="btn" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      <button class="btn" id="relayoutBtn" type="button">Re-layout</button>
      <button class="btn" id="expandBtn" type="button" title="Hide the side panel to give the graph the full width">Expand graph</button>
      <label class="check"><input type="checkbox" id="optLabels" checked> Edge labels</label>
      <label class="check"><input type="checkbox" id="optUncertain" checked> Show uncertain</label>
      <span class="spacer"></span>
      <span class="hint" id="ovCount"></span>
    </div>
    <div id="cy" role="img" aria-label="Architecture overview map"></div>
  </section>

  <div id="flowBar" class="bar" hidden>
    <label for="flowSel">Flow</label>
    <select id="flowSel"></select>
    <span class="chips" id="branchChips" role="group" aria-label="Path variant"></span>
  </div>

  <section id="view-journey" class="view" role="tabpanel" aria-labelledby="tab-journey">
    <div class="jwrap" id="jwrap"><svg id="jsvg" role="img" aria-label="Request journey"></svg></div>
    <div class="jbar">
      <button class="btn" id="jReset" type="button" title="Back to start">&#8634; Reset</button>
      <button class="btn" id="jPrev" type="button" title="Previous step (Left arrow)">&#9664; Prev</button>
      <button class="btn primary" id="jPlay" type="button">&#9654; Play</button>
      <button class="btn" id="jNext" type="button" title="Next step (Right arrow)">Next &#9654;</button>
      <span class="counter" id="jCount"></span>
      <label for="jSpeed" class="hint">Speed</label>
      <select id="jSpeed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
      <span class="spacer"></span>
      <span class="key"><span><i style="background:var(--req)"></i>Request</span><span><i style="background:var(--res)"></i>Response</span></span>
    </div>
    <div class="jlower">
      <div class="steps" id="stepList" aria-label="Steps"></div>
      <div class="card" id="stepCard" aria-live="polite"></div>
    </div>
  </section>

  <section id="view-sequence" class="view" role="tabpanel" aria-labelledby="tab-sequence">
    <div id="seqwrap"><div id="seq"></div></div>
  </section>
</main>

<aside>
  <div class="stabs" role="tablist">
    <button class="stab" role="tab" id="stab-legend" data-panel="legend" aria-selected="true">Legend</button>
    <button class="stab" role="tab" id="stab-details" data-panel="details" aria-selected="false">Details</button>
    <button class="stab" role="tab" id="stab-unc" data-panel="unc" aria-selected="false">Uncertain<span class="badge" id="uncBadge">0</span></button>
    <button class="sclose" id="panelClose" type="button" aria-label="Close side panel" title="Close panel">&#10005;</button>
  </div>
  <div class="spanel on" id="panel-legend"></div>
  <div class="spanel" id="panel-details"></div>
  <div class="spanel" id="panel-unc"></div>
</aside>
</div>

<!-- Data is injected by scripts/render.py. It replaces the token below with the JSON (with "</" escaped). -->
<script id="arch-data" type="application/json">__ARCHITECTURE_JSON__</script>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js" integrity="sha384-IWROdLKRsN1UuJywMlWl7/blXQ8GEooN2n7dzTxfEPd7ybYIKCUJ2Ol/1Gpf3YV4" crossorigin="anonymous"></script>

  const b = branchId && (f.branches || []).find(x => x.id === branchId);
  if (!b) return { seq: main, branch: null };
  const ai = main.findIndex(x => x.id === b.after);
  const seq = main.slice(0, ai + 1).concat((b.steps || []).map(x => Object.assign({}, x, { _b: b })));
  if (b.rejoin) { const ri = main.findIndex(x => x.id === b.rejoin); if (ri >= 0) seq.push.apply(seq, main.slice(ri)); }

let seqN = 0;
function mm(t) { // escape for Mermaid text

function renderSequence() {
  const f = currentFlow(), host = clear($('#seq'));
  if (!f || !(f.steps || []).length) { host.append(h('div', { class: 'empty', text: 'No request flows have been traced in this map yet. Run /repo-visualizer:visualize "METHOD /path" to trace one.' })); return; }
  const { seq, branch, divergeIndex } = buildSequence(f, state.branchId);
  seq.forEach((x, i) => { x._n = i + 1; });
  const cols = columnsFor(f).filter(id => seq.some(x => x.node === id));
  const pid = {}; cols.forEach((id, i) => { pid[id] = 'p' + i; });
  const lines = ['sequenceDiagram', 'autonumber'];
  cols.forEach(id => lines.push('participant ' + pid[id] + ' as ' + mm(nm(id))));
  lines.push('Note over ' + pid[seq[0].node] + ': ' + mm(trunc(seq[0].action, 70)));
  for (let k = 1; k < seq.length; k++) {
    const a = pid[seq[k - 1].node], b = pid[seq[k].node], res = seq[k].direction === 'response';
    if (branch && k === divergeIndex) lines.push('Note over ' + a + ',' + b + ': ' + mm('Branch: ' + branch.label + (branch.condition ? ' - ' + trunc(branch.condition, 60) : '')));
    lines.push(a + (res ? '-->>' : '->>') + b + ': ' + mm(trunc(seq[k].data || seq[k].action, 64)));

      themeVariables: { fontFamily: 'ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif' } });

function wireSequence(svg, seq, cols, pid) {

  texts.forEach(tx => {

function searchIndex() {
  const items = [];
  nodes.forEach(n => items.push({ k: 'node', id: n.id, title: n.name, sub: n.type, hay: [n.name, n.id, n.type, n.category, n.tech, n.description, (n.evidence || []).map(e => e.file).join(' ')].join(' ').toLowerCase() }));
  edges.forEach(e => items.push({ k: 'edge', id: e._id, title: nm(e.source) + ' → ' + nm(e.target), sub: e.label || e.kind, hay: [nm(e.source), nm(e.target), e.kind, e.label, (e.evidence || []).map(x => x.file).join(' ')].join(' ').toLowerCase() }));
  flows.forEach(f => {
    items.push({ k: 'flow', id: f.id, title: f.name, sub: f.summary, hay: [f.name, f.summary].join(' ').toLowerCase() });
    (f.steps || []).forEach((x, i) => items.push({ k: 'step', id: f.id, step: x.id, idx: i, title: 'Step ' + (i + 1) + ': ' + nm(x.node), sub: f.name + ' — ' + trunc(x.action, 60), hay: [x.action, x.data, nm(x.node), f.name].join(' ').toLowerCase() }));
  });
  uncertain.forEach(u => items.push({ k: 'unc', id: u._id, title: nm(u.source) + ' ⇢ ' + nm(u.target), sub: u.reason, hay: [nm(u.source), nm(u.target), u.reason].join(' ').toLowerCase() }));
  return items;
}
const SIDX = searchIndex();
function matches(q) {
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  return toks.length ? SIDX.filter(it => toks.every(t => it.hay.indexOf(t) >= 0)) : [];
}
function applySearch() {
  const q = state.query.trim(), ms = matches(q);
  const nodeHits = new Set(ms.filter(m => m.k === 'node').map(m => m.id));
  const stepHits = new Set(ms.filter(m => m.k === 'step' && m.id === state.flowId).map(m => m.idx));
  if (cy) cy.batch(() => {
    cy.nodes().removeClass('match');
    if (q) { cy.nodes().forEach(n => { if (nodeHits.has(n.id())) n.addClass('match'); }); }
    if (q && nodeHits.size) { cy.elements().addClass('dim'); cy.nodes('.match').removeClass('dim'); cy.nodes('.match').connectedEdges().removeClass('dim'); cy.nodes('.match').connectedEdges().connectedNodes().removeClass('dim'); }
    else if (!q) cy.elements().removeClass('dim');
  });
  $$('.jn', $('#jsvg')).forEach(g => g.classList.toggle('match', !!q && nodeHits.has(g.dataset.node)));
  $$('#stepList li').forEach(li => li.classList.toggle('match', !!q && stepHits.has(+li.dataset.i)));
}
function showResults() {
  const box = $('#results'), q = state.query.trim();
  if (!q) { box.hidden = true; return; }
  resItems = matches(q).slice(0, 14); resIdx = resItems.length ? 0 : -1;
  clear(box);
  if (!resItems.length) box.append(h('div', { class: 'none', text: 'No matches' }));
  resItems.forEach((it, i) => box.append(h('button', { type: 'button', class: i === 0 ? 'on' : '', onclick: () => pick(it) }, h('span', { class: 'rk', text: it.k === 'unc' ? 'unsure' : it.k }), h('span', null, h('span', { text: it.title }), it.sub ? h('span', { class: 'hint', text: '  ' + trunc(it.sub, 50) }) : null))));
  box.hidden = false;
}
function pick(it) {
  $('#results').hidden = true;
  if (it.k === 'node') { if (state.view === 'overview') selectNode(it.id); else { inspect('node', it.id); } }
  else if (it.k === 'edge') { inspect('edge', it.id); if (cy) { cy.elements().unselect(); const e = cy.getElementById(it.id); if (e.nonempty()) { e.select(); } } }
  else if (it.k === 'flow') openFlow(it.id, state.view === 'overview' ? 'journey' : state.view);
  else if (it.k === 'step') openFlow(it.id, 'journey', null, it.idx);
  else if (it.k === 'unc') { inspect('uncertain', it.id); showPanel('unc'); }
}
$('#search').addEventListener('input', e => { state.query = e.target.value; showResults(); applySearch(); });
$('#search').addEventListener('keydown', ev => {
  const box = $('#results'), btns = $$('button', box);
  if (ev.key === 'Escape') { ev.target.value = ''; state.query = ''; box.hidden = true; applySearch(); ev.target.blur(); }
  else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { if (!btns.length) return; resIdx = (resIdx + (ev.key === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length; btns.forEach((b, i) => b.classList.toggle('on', i === resIdx)); ev.preventDefault(); }
  else if (ev.key === 'Enter' && resItems[resIdx]) { pick(resItems[resIdx]); ev.preventDefault(); }
});
document.addEventListener('click', ev => { if (!ev.target.closest('.search')) $('#results').hidden = true; });

/* ------------------------------------------------------------------ hash state (deep links) */
function syncHash() {
  try {
    const p = ['view=' + state.view];
    if (state.flowId && state.view !== 'overview') { p.push('flow=' + encodeURIComponent(state.flowId)); if (state.branchId) p.push('branch=' + encodeURIComponent(state.branchId)); if (state.view === 'journey') p.push('step=' + (state.cur + 1)); }
    p.push('theme=' + state.theme);
    if (!state.panelOpen) p.push('panel=closed');
    history.replaceState(null, '', '#' + p.join('&'));
  } catch (e) { /* ignore */ }
}
function readHash() {
  const o = {}; (location.hash || '').replace(/^#/, '').split('&').forEach(kv => { const i = kv.indexOf('='); if (i > 0) o[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  return o;
}

/* ------------------------------------------------------------------ init */
document.title = (project.name ? project.name + ' — ' : '') + 'Architecture';
$('#projName').textContent = project.name || 'Architecture';
$('#projSummary').textContent = project.summary || '';
renderUncertain();
const hp = readHash();
const saved = store('repo-visualizer-theme');
setTheme(hp.theme || saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), false);
if (hp.flow && flows.some(f => f.id === hp.flow)) state.flowId = hp.flow;
if (hp.branch) { const f = currentFlow(); if (f && (f.branches || []).some(b => b.id === hp.branch)) state.branchId = hp.branch; }
if (hp.step) state.cur = Math.max(0, (parseInt(hp.step, 10) || 1) - 1);
fillFlowBar();
inspectInitial();
showPanel('legend');
if (hp.panel === 'closed' || (!hp.panel && store('repo-visualizer-panel') === 'closed')) setPanelOpen(false, { persist: false });
setView(['overview', 'journey', 'sequence'].indexOf(hp.view) >= 0 ? hp.view : 'overview');
function inspectInitial() {
  const p = $('#panel-details');
  p.append(h('h2', { text: 'Details' }),
    h('p', { class: 'hint', text: 'Click any component, connection, or step to see what it does and the file:line evidence behind it.' }),
    h('p', { class: 'hint' }, 'Tip: press ', h('code', { text: '/' }), ' to search, and use the arrow keys to step through a journey.'));
  const counts = {}; nodes.forEach(n => { counts[n.type] = (counts[n.type] || 0) + 1; });
  p.append(h('div', { class: 'field' }, h('h5', { text: 'At a glance' }),
    h('dl', { class: 'kv' }, h('dt', { text: 'Components' }), h('dd', { text: nodes.length }), h('dt', { text: 'Connections' }), h('dd', { text: edges.length }), h('dt', { text: 'Flows' }), h('dd', { text: flows.length }), h('dt', { text: 'Uncertain' }), h('dd', { text: uncertain.length }))));
  if (project.languages && project.languages.length) p.append(field('Languages', project.languages.join(', ')));
  if (project.frameworks && project.frameworks.length) p.append(field('Frameworks', project.frameworks.join(', ')));
}
})();
</script>
