<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endpoint viewer</title>
<style nonce="{{NONCE}}">
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16181d;--mute:#5b6270;--line:#d9dde4;--accent:#2457d6;--ok:#13795b;--okbg:#e2f5ee;--warn:#9a5b00;--warnbg:#fdf0d8;--bad:#b3261e;--badbg:#fbe4e2;--info:#1f5fa8;--infobg:#e3eefb;--code:#eef0f4;--resp:#13795b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101216;--panel:#181b21;--ink:#e8eaee;--mute:#9aa1ae;--line:#2b303a;--accent:#7aa2ff;--ok:#5fd3a8;--okbg:#12342a;--warn:#f0b75a;--warnbg:#3a2b10;--bad:#ff8b82;--badbg:#3d1815;--info:#8fbaf0;--infobg:#17283d;--code:#20242c;--resp:#5fd3a8}}
:root[data-theme=dark]{--bg:#101216;--panel:#181b21;--ink:#e8eaee;--mute:#9aa1ae;--line:#2b303a;--accent:#7aa2ff;--ok:#5fd3a8;--okbg:#12342a;--warn:#f0b75a;--warnbg:#3a2b10;--bad:#ff8b82;--badbg:#3d1815;--info:#8fbaf0;--infobg:#17283d;--code:#20242c;--resp:#5fd3a8}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1560px;margin:0 auto;padding:18px 16px 140px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}h3{font-size:12px;margin:12px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
form{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
input[type=text]{flex:1 1 320px;min-width:0}
button{padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.stages{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;padding:0;list-style:none}
.stages li{padding:4px 11px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--mute)}
.stages li.arrow{border:0;padding:0 2px}
.stages li.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stages li.past{color:var(--ok);border-color:var(--ok)}
.stages li.opt{opacity:.55}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--okbg);border-color:transparent}.chip.warn{color:var(--warn);background:var(--warnbg);border-color:transparent}.chip.bad{color:var(--bad);background:var(--badbg);border-color:transparent}.chip.info{color:var(--info);background:var(--infobg);border-color:transparent}
.method{font-weight:700;color:var(--accent)}
.badge{padding:0;width:22px;height:22px;line-height:20px;border-radius:50%;text-align:center;font-size:13px;font-weight:700;border:1.5px solid currentColor;background:transparent;flex:none}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}.badge.inh{opacity:.55;border-style:dotted}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);align-items:center;margin-top:8px}
.legend .badge{pointer-events:none;display:inline-block;width:18px;height:18px;line-height:16px;font-size:11px}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;padding:0;list-style:none}
.hist button{display:flex;gap:6px;align-items:center;font-size:13px;padding:5px 10px}
.hist button[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs button[aria-selected=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.s2{border-left:4px solid var(--ok)}.s3{border-left:4px solid var(--info)}.s4{border-left:4px solid var(--warn)}.s5{border-left:4px solid var(--bad)}
.panels{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1280px){.panels{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.panel>header h2{display:flex;gap:8px;align-items:center}
.n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}
.small{padding:2px 8px;font-size:12px}
.tl{margin:0}
.krow{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.krow .tg{width:22px;height:22px;padding:0;line-height:20px;text-align:center;flex:none}
.krow .sp{width:22px;flex:none}
.krow .key{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
.krow .rules{flex:1 1 100%;margin-left:28px;font-size:12px;color:var(--mute)}
.kids{margin-left:16px;border-left:1px dashed var(--line);padding-left:6px}
.kids[hidden]{display:none}
.journey{display:grid;grid-template-columns:minmax(0,236px) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:640px){.journey{grid-template-columns:minmax(0,1fr)}}
.diagram{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
svg text{font:12px system-ui,sans-serif;fill:var(--ink)}
.nb{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.nb.client{stroke:var(--accent)}.nb.database,.nb.cache,.nb.queue,.nb.storage{stroke:var(--warn)}.nb.middleware{stroke:var(--info)}.nb.external-api{stroke:var(--bad)}
.nb.on{stroke-width:3;stroke:var(--accent);fill:var(--infobg)}
.nt{fill:var(--mute)!important;font-size:10px!important}
.sg{fill:none;stroke-width:2;opacity:.35}
.sg.req{stroke:var(--accent)}.sg.resp{stroke:var(--resp);stroke-dasharray:5 3}
.sg.done{opacity:.8}.sg.on{opacity:1;stroke-width:3.5}
.bub{fill:var(--panel);stroke:var(--line)}.bub.on{fill:var(--accent);stroke:var(--accent)}.bt{font-size:10px!important;text-anchor:middle}.bt.on{fill:#fff!important}
.dot{fill:var(--warn);stroke:var(--panel);stroke-width:2}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)}
ol.steps li.on{background:var(--infobg)}
.stepbtn{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;text-align:left;flex:1;border:0;background:transparent;padding:2px 4px;border-radius:6px}
.stepbtn .num{color:var(--mute);text-align:right}
.diff{font-size:13px;color:var(--mute)}
ul.plain{margin:4px 0;padding-left:18px}
.err{color:var(--bad)}
.sr{position:absolute;left:-9999px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:12px 0}
@media (max-width:760px){.cmp{grid-template-columns:minmax(0,1fr)}}
.split{margin:8px 0;padding:8px 12px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-size:12px}
aside#insp{position:fixed;left:0;right:0;bottom:0;max-height:48vh;overflow:auto;background:var(--panel);border-top:2px solid var(--accent);padding:12px 16px;box-shadow:0 -6px 20px rgba(0,0,0,.15);z-index:5}
aside#insp[hidden]{display:none}
aside#insp pre{margin:6px 0;padding:8px 10px;background:var(--code);border-radius:6px;overflow:auto;font:12.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Endpoint viewer</h1><button type="button" id="theme" class="small" aria-label="Toggle light and dark">Light / dark</button></div>
  <form id="f" autocomplete="off">
    <label class="sr" for="q">Endpoint</label>
    <input type="text" id="q" maxlength="200" placeholder="Enter an endpoint (e.g. POST /api/login)" spellcheck="false">
    <button class="primary" id="go" type="submit">Analyze</button>
    <button type="button" id="re" disabled title="Analyze again even if the code has not changed">Re-analyze</button>
  </form>
  <p class="hint">Nothing is pre-traced. Each endpoint is analyzed on demand, then verified by a separate read-only run before it is shown. Keys and types only, never values.</p>
  <div id="status" role="status" aria-live="polite"></div>
  <ul class="hist" id="hist" aria-label="Endpoints analyzed this session"></ul>
  <div id="out"></div>
</main>
<aside id="insp" role="dialog" aria-label="Evidence" hidden></aside>
